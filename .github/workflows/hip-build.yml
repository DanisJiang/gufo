name: Hosted HIP build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile gfx1151 package (no GPU execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true
      - name: Build production package
        run: nix build .#default --print-build-logs --cores 2 --max-jobs 1
      - name: Package incremental runtime update
        run: |
          gufo_package_path=$(readlink -f ./result)
          nix-store --query --requisites ./result > closure-paths.txt
          tar -C / -I 'zstd -T2 -3' -cf gufo-package.tar.zst "${gufo_package_path#/}"
          sha256sum gufo-package.tar.zst closure-paths.txt > gufo-package.sha256
      - name: Upload incremental runtime update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gufo-package-${{ github.sha }}
          path: |
            gufo-package.tar.zst
            gufo-package.sha256
            closure-paths.txt
          retention-days: 7
      - name: Package build for download
        run: |
          nix-store --query --requisites ./result > closure-paths.txt
          nix-store --export $(cat closure-paths.txt) | zstd -T2 -3 > gufo-gfx1151.nar.zst
          sha256sum gufo-gfx1151.nar.zst > gufo-gfx1151.nar.zst.sha256
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gufo-gfx1151-${{ github.sha }}
          path: |
            gufo-gfx1151.nar.zst
            gufo-gfx1151.nar.zst.sha256
          retention-days: 7
