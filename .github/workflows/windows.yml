name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      GUFO_ROCM: C:\TheRock\build
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_BINARY_CACHE: C:\gufo-ci-cache\vcpkg-binaries
      CCACHE_DIR: C:\gufo-ci-cache\ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test binary provenance policy
        shell: pwsh
        run: .\tools\windows\test-provenance.ps1

      - name: Checkout pinned vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: 20ceb8adbf0504d4b0d5e4058a32f9d4fc896391
          path: vcpkg

      - name: Install qualified TheRock SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'therock.tar.gz'
          Invoke-WebRequest 'https://stable.repo.amd.com/rocm/core/tarball/therock-dist-windows-gfx1151-10.0.0.tar.gz' -OutFile $archive
          $expected = '1293927b06b3b8d4bd7e0265823fb998bc9e0d83c68f33dcfa5d32663b30ce38'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'TheRock checksum mismatch'
          }
          New-Item -ItemType Directory -Force $env:GUFO_ROCM | Out-Null
          tar -xf $archive -C $env:GUFO_ROCM
          if ($LASTEXITCODE -ne 0) { throw 'TheRock extraction failed' }
          Remove-Item $archive

      - name: Identify dependency toolchain image
        id: runner-image
        shell: pwsh
        run: |
          $version = if ($env:ImageVersion) { $env:ImageVersion } else { $env:GITHUB_SHA }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore compiled dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-2025-x64-20ceb8adbf0504d4b0d5e4058a32f9d4fc896391-${{ steps.runner-image.outputs.version }}
          restore-keys: vcpkg-windows-2025-x64-20ceb8adbf0504d4b0d5e4058a32f9d4fc896391

      - name: Install CPU dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          & .\vcpkg\vcpkg.exe install icu curl openssl libpng libjpeg-turbo libwebp --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed' }

      - name: Cache compiled dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gufo-windows-2025-therock10-v1-${{ github.sha }}
          restore-keys: gufo-windows-2025-therock10-v1-

      - name: Build CPU contracts
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          & .\tools\windows\build.ps1 -Preset cpu-test -Target gufo -Rocm $env:GUFO_ROCM -Vcpkg $vcpkg -Jobs 2 -KeepGoing
          if ($LASTEXITCODE -ne 0) { throw 'CPU CLI build failed' }
          cmake --build build/cpu-test --parallel 2 --target cache_adapter_test cache_ledger_test cache_slot_test cache_idle_spill_test qwen38_flash_next_draft_vocab_test qwen38_flash_next_prompt_lookup_test cache_adapter_lifecycle_test cache_checkpoint_test cache_prefix_index_test cache_retention_test cache_streaming_test cache_disk_portable_test component_text_cache_test text_model_runner_test continuation_disk_store_test text_generation_scheduler_test openai_chat_test http_server_test audio_websocket_test qwen_chat_template_test platform_tuning_test json_constraint_test -- -k 0
          if ($LASTEXITCODE -ne 0) { throw 'CPU contract build failed' }

      - name: Run cache and server contracts
        shell: pwsh
        run: |
          ctest --test-dir build/cpu-test --output-on-failure --timeout 60 -R '^(cache_adapter_test|cache_ledger_test|cache_slot_test|cache_idle_spill_test|qwen38_flash_next\.draft_vocab|qwen38_flash_next\.prompt_lookup|cache_adapter_lifecycle_test|cache_checkpoint_test|cache_prefix_index_test|cache_retention_test|cache_streaming_test|cache_disk_portable_test|component_text_cache_test|text_model_runner_test|continuation_disk_store_test|text_generation_scheduler_test|openai_chat_test|http_server_test|audio_websocket_test|qwen_chat_template_test|platform_tuning_test|json_constraint_test)$'
          if ($LASTEXITCODE -ne 0) { throw 'Windows CPU contracts failed' }

      - name: Build production gfx1151 binary
        shell: pwsh
        run: |
          & .\tools\windows\build.ps1 -Preset release -Rocm $env:GUFO_ROCM -Vcpkg (Join-Path $env:GITHUB_WORKSPACE 'vcpkg') -Jobs 2 -KeepGoing
          if ($LASTEXITCODE -ne 0) { throw 'Production build failed' }
          $version = (Get-Content version.txt -TotalCount 1).Trim()
          & .\tools\windows\package.ps1 -Version "$version-$($env:GITHUB_SHA.Substring(0, 7))" -Vcpkg (Join-Path $env:GITHUB_WORKSPACE 'vcpkg') -Rocm $env:GUFO_ROCM
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }

      - name: Smoke-test packaged CLI
        shell: pwsh
        run: |
          $binaries = @(Get-ChildItem 'dist/gufo-windows-*/bin/gufo.exe')
          if ($binaries.Count -ne 1) { throw 'Expected one packaged executable' }
          $binary = $binaries[0]
          $originalPath = $env:PATH
          try {
            # Check app-local DLLs without the build toolchain on PATH.
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Push-Location $binary.DirectoryName
            try {
              & $binary.FullName --version
              if ($LASTEXITCODE -ne 0) { throw 'Packaged version command failed' }
              & $binary.FullName --help
              if ($LASTEXITCODE -ne 0) { throw 'Packaged help command failed' }
            } finally { Pop-Location }
          } finally { $env:PATH = $originalPath }

      - name: Scan package with Microsoft Defender when available
        shell: pwsh
        run: |
          $stage = @(Get-ChildItem dist -Directory -Filter 'gufo-windows-*')
          if ($stage.Count -ne 1) { throw 'Expected one staged package' }
          & .\tools\windows\scan-package.ps1 -Path $stage[0].FullName -Report "dist/$($stage[0].Name).defender.json"

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gufo-windows-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.provenance.json
            dist/*.defender.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload provenance and scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-provenance-${{ github.sha }}
          path: |
            dist/*.provenance.json
            dist/*.defender.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gufo-windows-2025-therock10-v1-${{ github.sha }}

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-logs-${{ github.sha }}
          path: build/cpu-test/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 14

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download this run's verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gufo-windows-${{ github.sha }}
          path: verified-package

      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            verified-package/*.zip
            verified-package/*.provenance.json
            verified-package/*.defender.json
